# ModSecurity Configuration
modsecurity on;
modsecurity_rules_file /etc/nginx/modsec/main.conf;

# Security headers
add_header X-XSS-Protection "1; mode=block";
add_header X-Frame-Options "SAMEORIGIN";
add_header X-Content-Type-Options "nosniff";
add_header Referrer-Policy "strict-origin-when-cross-origin";
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';";

# Rate limiting
limit_req_zone $binary_remote_addr zone=one:10m rate=1r/s;
limit_req zone=one burst=5 nodelay;

# Basic attack prevention
# Prevent XSS attacks
modsecurity_rules '
SecRule REQUEST_COOKIES|!REQUEST_COOKIES:/__utm/|REQUEST_COOKIES_NAMES|REQUEST_HEADERS:User-Agent|REQUEST_HEADERS:Referer|ARGS_NAMES|ARGS|XML:/* "@detectXSS" \
    "id:1,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:\'XSS Attack Detected\'"
';

# Prevent SQL Injection
modsecurity_rules '
SecRule REQUEST_COOKIES|!REQUEST_COOKIES:/__utm/|REQUEST_COOKIES_NAMES|REQUEST_HEADERS:User-Agent|REQUEST_HEADERS:Referer|ARGS_NAMES|ARGS|XML:/* "@detectSQLi" \
    "id:2,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:\'SQL Injection Attack Detected\'"
';

# File upload restrictions
modsecurity_rules '
SecRule FILES "\.(?:php|phtml|php3|php4|php5|php7|phar|phps)$" \
    "id:3,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:\'PHP File Upload Attempt\'"
';
